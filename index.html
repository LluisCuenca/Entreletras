<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f4ee">
  <meta name="description" content="25 crucigramas y autodefinidos originales en español. De fácil a experto, a tu ritmo.">
  <title>Entreletras · Crucigramas y autodefinidos</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script src="puzzles.js" defer></script>
  <script src="core.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a href="#game" class="skip-link">Ir al juego</a>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Entreletras, inicio">entreletras<span>.</span></a>
    <span class="edition">Un rato para tus palabras.</span>
    <button id="levels" class="levels-button" aria-haspopup="dialog"><span class="desktop-label">El recorrido</span><span class="mobile-label">Niveles</span><span id="total-completed">0 / 25</span><span aria-hidden="true">↗</span></button>
  </header>
  <main id="game" tabindex="-1">
    <section class="game-heading" aria-labelledby="level-title">
      <div class="title-group"><div class="eyebrow" id="level-kind"></div><h1 id="level-title"></h1></div>
      <div class="level-navigation"><button id="prev-level" class="icon-button" aria-label="Nivel anterior">‹</button><button id="next-level" class="icon-button" aria-label="Nivel siguiente">›</button></div>
      <span id="difficulty" class="difficulty"></span>
    </section>
    <div class="workspace">
      <section class="play-area" aria-label="Zona de juego">
        <div class="game-toolbar">
          <span id="word-count" class="fill-count"></span>
          <div class="toolbar-buttons">
            <button id="zoom-out" class="tool-button" aria-label="Reducir tablero">−</button>
            <button id="zoom-fit" class="tool-button fit-button" aria-label="Ajustar tablero al espacio disponible">Ajustar</button>
            <button id="zoom-in" class="tool-button" aria-label="Ampliar tablero">+</button>
            <span class="tool-separator" aria-hidden="true"></span>
            <button id="show-clues" class="tool-button" aria-expanded="true" aria-controls="clues-panel">Pistas</button>
            <button id="options" class="tool-button" aria-label="Opciones de juego" aria-haspopup="dialog">•••</button>
          </div>
        </div>
        <div class="board-viewport" id="board-scroll" tabindex="0" aria-label="Tablero desplazable. Usa las casillas para escribir."><div id="board" class="board" role="group" aria-label="Tablero de palabras"></div></div>
        <div id="board-guidance" class="board-guidance">Toca una casilla para empezar</div>
        <div class="play-dock">
          <div class="active-clue" aria-live="polite" aria-atomic="true">
            <button id="prev-clue" aria-label="Pista anterior">‹</button>
            <div><span id="active-label"></span><p id="active-text"></p></div>
            <button id="next-clue" aria-label="Pista siguiente">›</button>
          </div>
          <div class="actions">
            <button id="undo" class="action-button" aria-label="Deshacer última letra" title="Deshacer (Ctrl o ⌘ Z)">↶ <span>Deshacer</span></button>
            <button id="check" class="action-button">Comprobar</button>
            <button id="hint" class="action-button">Revelar letra<span id="hint-count"></span></button>
          </div>
          <div id="keyboard" class="keyboard" role="group" aria-label="Teclado en pantalla"></div>
          <p id="status" class="status" role="status" aria-live="polite">Tu partida se guarda automáticamente.</p>
          <div id="update-notice" class="update-notice" role="status" hidden><span>Hay una nueva versión disponible.</span><button id="update-app">Actualizar</button></div>
        </div>
      </section>
      <aside class="clues-panel" id="clues-panel" aria-labelledby="clues-title">
        <div class="panel-heading"><div><div class="eyebrow">PISTA A PISTA</div><h2 id="clues-title">Las palabras</h2></div><button id="close-clues" class="icon-button" aria-label="Ocultar lista de pistas">×</button></div>
        <div id="clue-list" class="clue-list"></div>
        <p class="panel-note">Selecciona una definición para ir a su palabra.</p>
      </aside>
    </div>
    <div id="save-warning" class="save-warning" role="alert" hidden></div>
  </main>
  <dialog id="modal" aria-labelledby="modal-title"><button class="modal-close icon-button" aria-label="Cerrar ventana">×</button><div id="modal-content"></div></dialog>
  <noscript>Activa JavaScript en el navegador para jugar a Entreletras.</noscript>
</body>
</html>
